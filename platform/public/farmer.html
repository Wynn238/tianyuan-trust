<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>农户工作台 · 田源可信</title>
<meta name="description" content="田源可信农户端工作台：今日待办、批次与赋码、语音拍照扫码录入农事记录、AI 文案、订单结算与 7 日经营看板。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314402C'/%3E%3Cpath d='M7 24c0-9 6.5-15 18-16 .8 9.5-6 15.5-14 16Z' fill='none' stroke='%23C9DFCF' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M7 24c3.5-3.5 7-7 11-10' stroke='%23C9DFCF' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/design.css?v=20261127c">
  <link rel="stylesheet" href="/assets/auth.css?v=20261127f">
<style>
  /* 本页只做布局与组件组合，颜色、字号、间距、圆角全部取自 design.css 的 token */
  .page{padding-top:calc(var(--nav-h) + var(--s-600));padding-bottom:var(--s-600)}
  .page > section{animation:pageIn .5s var(--ease) both}
  @keyframes pageIn{from{opacity:0;transform:translateY(var(--s-200))}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.page > section{animation:none}}
  .block{margin-top:var(--s-700);scroll-margin-top:calc(var(--nav-h) + var(--s-400))}
  .block__head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s-200);flex-wrap:wrap;margin-bottom:var(--s-300)}
  .block__head > div{max-width:660px}

  /* 顶部身份卡 */
  .hero{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s-300);align-items:end}
  .hero__main{display:flex;flex-direction:column}
  .hero__side{display:flex;flex-direction:column;gap:var(--s-75);align-items:flex-start}
  .hero__rule{grid-column:1/-1;background:var(--green-200);margin-top:var(--s-300)}
  .hero__switch{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:var(--s-200);flex-wrap:wrap}
  .hero .segmented{flex-wrap:wrap}
  .hero .segmented button{white-space:nowrap}
  @media (min-width:901px){.hero__side{align-items:flex-end;text-align:right}}
  @media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}

  /* KPI */
  .kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s-200)}
  .kpi{display:flex;flex-direction:column;gap:var(--s-50)}
  .kpi__head{display:flex;align-items:center;justify-content:space-between;gap:var(--s-100);margin-bottom:var(--s-50)}
  .kpi__icon{width:36px;height:36px;border-radius:var(--r-md);background:var(--green-50);color:var(--green-700);display:grid;place-items:center;flex:none}
  .kpi__icon svg{width:18px;height:18px}
  .kpi .stat__value{margin-top:var(--s-50)}
  @media (max-width:1080px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:640px){.kpi-grid{grid-template-columns:minmax(0,1fr)}}
  @media (max-width:480px){.kpi{padding:var(--s-200)}}
  .strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s-300)}
  .strip__item{display:flex;flex-direction:column;gap:var(--s-25);min-width:0}
  @media (max-width:820px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

  /* 待办 */
  .todo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-200)}
  .todo{display:flex;flex-direction:column;gap:var(--s-200)}
  .todo--zero{background:var(--surface-2)}
  .todo__num{display:flex;align-items:baseline;gap:var(--s-50)}
  @media (max-width:900px){.todo-grid{grid-template-columns:minmax(0,1fr)}}

  /* 表格内的紧凑操作 */
  .card-head{padding:var(--s-300) var(--s-300) var(--s-200)}
  .cell-actions{display:flex;flex-wrap:wrap;gap:var(--s-50)}
  .table tbody tr.is-new{background:var(--green-50)}
  .cell-strong{display:flex;flex-direction:column;gap:var(--s-25);min-width:0}
  .hash{word-break:break-all;overflow-wrap:anywhere}

  /* 农事记录 */
  .record-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s-200);align-items:start}
  .form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-200)}
  .chips{display:flex;flex-wrap:wrap;gap:var(--s-75)}
  .chip{display:inline-flex;align-items:center;gap:var(--s-50);padding:var(--s-50) var(--s-100);border:1px solid var(--line-strong);border-radius:var(--r-full);background:var(--surface);color:var(--ink-2);cursor:pointer;transition:background .3s var(--ease),border-color .3s var(--ease),color .3s var(--ease),transform .3s var(--ease)}
  .chip svg{width:14px;height:14px}
  .chip:hover{background:var(--surface-2)}
  .chip:active{transform:scale(.98)}
  .chip[aria-pressed="true"]{background:var(--green-700);border-color:var(--green-700);color:#fff}
  .chip[aria-pressed="true"]:hover{background:var(--green-800)}
  .tabpanel[hidden]{display:none}
  .file-pick{position:relative;display:inline-flex;align-items:center;gap:var(--s-75);padding:var(--s-75) var(--s-100);border:1px solid var(--line-strong);border-radius:var(--r-md);background:var(--surface);cursor:pointer;transition:background .3s var(--ease),border-color .3s var(--ease)}
  .file-pick:hover{background:var(--surface-2)}
  .file-pick:focus-within{outline:2px solid var(--green-600);outline-offset:2px}
  .file-pick svg{width:18px;height:18px}
  .file-pick input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  .voice{display:flex;flex-direction:column;gap:var(--s-100);padding:var(--s-200);border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2)}
  .voice__box{min-height:var(--s-600);padding:var(--s-100) var(--s-200);border:1px dashed var(--line-strong);border-radius:var(--r-sm);background:var(--surface);color:var(--muted)}
  .voice__box.is-live{border-color:var(--green-200);background:var(--green-50);color:var(--green-800)}
  .scan-row{display:flex;align-items:center;gap:var(--s-75);flex-wrap:wrap}
  .scan-row .input{flex:1 1 55%;min-width:0}
  .photo-row{display:flex;align-items:center;gap:var(--s-200);flex-wrap:wrap}
  .thumb{width:var(--s-800);height:var(--s-800);border-radius:var(--r-md);border:1px solid var(--line);object-fit:cover;background:var(--surface-2);flex:none}
  .receipt{display:flex;gap:var(--s-100);padding:var(--s-200);border:1px solid var(--green-200);border-radius:var(--r-md);background:var(--green-50)}
  .receipt__icon{width:var(--s-400);height:var(--s-400);border-radius:var(--r-full);background:var(--green-100);color:var(--green-800);display:grid;place-items:center;flex:none}
  .receipt__icon svg{width:18px;height:18px}
  .side-tips{display:flex;flex-direction:column;gap:var(--s-100)}
  .side-tips__item{display:flex;gap:var(--s-75);align-items:flex-start}
  .side-tips__item svg{flex:none;width:16px;height:16px;margin-top:var(--s-25);color:var(--green-700)}
  @media (max-width:960px){.record-grid{grid-template-columns:minmax(0,1fr)}}
  @media (max-width:640px){.form-grid{grid-template-columns:minmax(0,1fr)}}

  /* AI 文案 */
  .ai-grid{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);gap:var(--s-200);align-items:start}
  .ai-art{width:var(--s-800);height:var(--s-800);flex:none;border-radius:var(--r-md);overflow:hidden;background:var(--surface-2)}
  .ai-art svg{width:100%;height:100%}
  .ai-block{display:flex;flex-direction:column;gap:var(--s-75)}
  .ai-block__head{display:flex;align-items:center;justify-content:space-between;gap:var(--s-100)}
  .point{display:flex;align-items:flex-start;gap:var(--s-75)}
  .point__tick{flex:none;display:flex;color:var(--green-700)}
  .point__tick svg{width:16px;height:16px;margin-top:var(--s-25)}
  .segmented--block{display:flex;width:100%}
  .segmented--block button{flex:1}
  .script{display:flex;flex-direction:column;gap:var(--s-75)}
  .script li{display:grid;grid-template-columns:var(--s-300) minmax(0,1fr);gap:var(--s-75)}
  .script__no{font-family:var(--font-mono);color:var(--muted)}
  .tag-btn{display:inline-flex;align-items:center;padding:var(--s-25) var(--s-75);border:1px solid var(--line);border-radius:var(--r-full);background:var(--surface);color:var(--ink-2);cursor:pointer;transition:background .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease)}
  .tag-btn:hover{background:var(--green-50);border-color:var(--green-200)}
  .tag-btn:active{transform:scale(.98)}
  @media (max-width:960px){.ai-grid{grid-template-columns:minmax(0,1fr)}}

  /* 订单与结算 */
  .orders-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s-200);align-items:start}
  .flush-table{border:0;border-radius:0;background:transparent}
  @media (max-width:960px){.orders-grid{grid-template-columns:minmax(0,1fr)}}

  /* 看板 */
  .insight-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s-200);align-items:start}
  .chart{margin-top:var(--s-200)}
  .legend-row{display:flex;flex-direction:column;gap:var(--s-50);min-width:0}
  .legend-row__top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s-100)}
  .kw{display:inline-flex;align-items:center;gap:var(--s-50);padding:var(--s-25) var(--s-100);border:1px solid var(--line);border-radius:var(--r-full);background:var(--surface-2)}
  .timeline__dot--warn{background:var(--amber-100);border-color:var(--amber-200);color:var(--amber-800)}
  @media (max-width:960px){.insight-grid{grid-template-columns:minmax(0,1fr)}}

  /* 表格在窄屏的细节 */
  @media (max-width:640px){
    .table--stack td > *{min-width:0}
    .table--stack .cell-actions{justify-content:flex-end}
  }
</style>
</head>
<body class="page-farmer">
<a class="skip-link" href="#main">跳到主要内容</a>
<div class="nav-shell" data-nav="home"></div>
<main id="main">
  <div class="container page">

    <section class="hero card card--green card--pad-lg" id="hero" aria-labelledby="hero-title"></section>

    <section class="card card--pad" id="notices" hidden aria-labelledby="notices-title">
      <div class="row between gap-100 wrap">
        <div>
          <h2 class="heading-6" id="notices-title">消息</h2>
          <p class="caption-2 muted">入驻、商品审核结果会出现在这里</p>
        </div>
        <button class="btn btn--ghost btn--sm" type="button" id="notices-read-all">全部已读</button>
      </div>
      <div id="notices-list" class="stack gap-100 mt-200"></div>
    </section>

    <div class="segmented farmer-tabs" data-farmer-tabs role="tablist" aria-label="农户工作台分组">
      <button type="button" role="tab" data-tab="today" aria-selected="true">今日</button>
      <button type="button" role="tab" data-tab="batches" aria-selected="false">批次与农事</button>
      <button type="button" role="tab" data-tab="orders" aria-selected="false">订单与结算</button>
      <button type="button" role="tab" data-tab="business" aria-selected="false">经营</button>
    </div>

    <section class="block" id="kpi" aria-labelledby="kpi-title">
      <div class="block__head">
        <div>
          <h2 class="heading-5" id="kpi-title">今日概览</h2>
          <p class="body-6 muted mt-200">成交与订单来自平台订单库，口碑数据来自已签收评价</p>
        </div>
        <span class="badge" data-updated="1">正在同步</span>
      </div>
      <div id="kpi-body" aria-live="polite"></div>
    </section>

    <section class="block" id="todos" aria-labelledby="todos-title">
      <div class="block__head">
        <div>
          <h2 class="heading-5" id="todos-title">待处理事项</h2>
          <p class="body-6 muted mt-200">按农事记录 48 小时规则与订单发货时限生成</p>
        </div>
      </div>
      <div id="todos-body" aria-live="polite"></div>
    </section>

    <section class="block" id="batches" aria-labelledby="batches-title">
      <div class="block__head">
        <div>
          <h2 class="heading-5" id="batches-title">批次与赋码</h2>
          <p class="body-6 muted mt-200">一个批次一枚溯源码，码对应地块、农事记录与检测报告</p>
        </div>
        <div class="row wrap gap-75">
          <button class="btn btn--ghost" type="button" data-action="new-product">
            <span data-icon="plus"></span>新建商品
          </button>
          <button class="btn btn--secondary" type="button" data-action="new-batch">
            <span data-icon="plus"></span>新建批次
          </button>
        </div>
      </div>
      <div id="batches-body" aria-live="polite"></div>
    </section>

    <section class="block" id="records" aria-labelledby="records-title">
      <div class="block__head">
        <div>
          <h2 class="heading-5" id="records-title">农事记录</h2>
          <p class="body-6 muted mt-200">语音、拍照、扫码三种录入方式，提交即写入哈希链，消费者扫码可见</p>
        </div>
        <span class="badge badge--green">提交即上链</span>
      </div>
      <div id="records-body" aria-live="polite"></div>
    </section>

    <section class="block" id="content" aria-labelledby="content-title">
      <div class="block__head">
        <div>
          <h2 class="heading-5" id="content-title">AI 文案</h2>
          <p class="body-6 muted mt-200">按批次档案、检测报告与产地故事生成，发布前由农户确认</p>
        </div>
        <span class="badge badge--blue">内容智能体</span>
      </div>
      <div class="ai-grid">
        <div id="content-form"></div>
        <div id="content-result"></div>
      </div>
    </section>

    <section class="block" id="orders" aria-labelledby="orders-title">
      <div class="block__head">
        <div>
          <h2 class="heading-5" id="orders-title">订单与结算</h2>
          <p class="body-6 muted mt-200">冷链订单的状态与物流，以及 T+1 结算口径</p>
        </div>
      </div>
      <div id="orders-body" aria-live="polite"></div>
    </section>

    <section class="block" id="insight" aria-labelledby="insight-title">
      <div class="block__head">
        <div>
          <h2 class="heading-5" id="insight-title">经营看板</h2>
          <p class="body-6 muted mt-200">近 7 日成交与订单走势，品类结构与评价关键词</p>
        </div>
      </div>
      <div id="insight-body" aria-live="polite"></div>
    </section>

  </div>
</main>
<div data-footer></div>
<script src="/assets/app.js?v=20261127g"></script>
<script src="/assets/art.js"></script>
<script src="/js/auth.js?v=20261127f"></script>
  <script>
    // 未登录时只显示登录门；登录成功后重新载入页面再加载工作台脚本
    Auth.requirePage({
      roles: ['farmer'],
      gate: {
        role: 'farmer',
        title: '农户工作台',
        desc: '请使用农户账号登录，登录后可管理批次、记录农事与查看结算。',
      },
      script: '/js/farmer.js?v=20261127a',
    });
  </script>
</body>
</html>

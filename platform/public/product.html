<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商品详情 · 田源可信</title>
<meta name="description" content="田源可信产地商品详情：查看规格、检测报告、价格构成、农户档案与同产地推荐，一箱一码可查。">
<meta property="og:type" content="product">
<meta property="og:title" content="商品详情 · 田源可信">
<meta property="og:description" content="查看规格、检测报告、价格构成、农户档案与同产地推荐，一箱一码可查。">
<meta property="og:site_name" content="田源可信">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314402C'/%3E%3Cpath d='M6 25C6 14 15 7 27 6c1 11-7 18-19 18Z' fill='none' stroke='%23FAF8F2' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M6 25c5-5 9-9 14-13' fill='none' stroke='%23FAF8F2' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/design.css?v=20261127c">
  <link rel="stylesheet" href="/assets/auth.css?v=20261127f">
<style>
  /* 商品详情页布局：只组合 design.css 的 token 与文字样式 */
  .page{padding-top:calc(var(--nav-h) + var(--s-500));padding-bottom:var(--s-700)}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* 面包屑 */
  .crumb{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-75);min-height:var(--s-300);margin-bottom:var(--s-300)}
  .crumb a{color:var(--muted);transition:color .3s var(--ease)}
  .crumb a:hover{color:var(--ink)}
  .crumb__sep{color:var(--line-strong)}
  .crumb [aria-current="page"]{color:var(--ink)}

  /* 两栏 */
  .product-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--s-500);align-items:start}
  .gallery{display:flex;flex-direction:column;gap:var(--s-100);min-width:0}
  .stage{position:relative;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--surface-2);padding:var(--s-300);display:grid;place-items:center;overflow:hidden;transition:background .5s var(--ease)}
  .stage svg{width:100%;height:auto}
  .stage[data-view="2"]{background:var(--green-50)}
  .stage[data-view="3"]{background:var(--amber-100)}
  .stage[data-view="4"]{background:var(--blue-100)}
  .stage__badges{position:absolute;left:var(--s-200);top:var(--s-200);display:flex;flex-wrap:wrap;gap:var(--s-50);z-index:1}
  .view-note{display:flex;align-items:flex-start;gap:var(--s-75);padding:var(--s-75) var(--s-100);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
  .view-note__key{color:var(--green-800);flex:none}
  .view-note__meta{min-width:0}

  .thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s-75)}
  .thumb{display:flex;flex-direction:column;align-items:center;gap:var(--s-25);padding:var(--s-50);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);cursor:pointer;text-align:center;transition:border-color .3s var(--ease),background .3s var(--ease),transform .3s var(--ease),box-shadow .3s var(--ease)}
  .thumb:hover{border-color:var(--line-strong);background:var(--surface-2)}
  .thumb:active{transform:scale(.98)}
  .thumb[aria-pressed="true"]{border-color:var(--green-600);background:var(--green-50);box-shadow:0 0 0 2px var(--green-100)}
  .thumb__art{position:relative;width:100%;aspect-ratio:1/1;border-radius:var(--r-sm);overflow:hidden;display:grid;place-items:center;background:var(--surface-2)}
  .thumb__art svg{width:100%;height:100%;mix-blend-mode:multiply}
  .thumb:nth-child(2) .thumb__art{background:var(--green-50)}
  .thumb:nth-child(3) .thumb__art{background:var(--amber-100)}
  .thumb:nth-child(4) .thumb__art{background:var(--blue-100)}
  .thumb__label{color:var(--ink-2);padding-block:var(--s-25)}

  /* 右栏购买区 */
  .buybox{display:flex;flex-direction:column;gap:var(--s-200);min-width:0}
  .badge svg{width:var(--s-200);height:var(--s-200);flex:none}
  .head-meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-50)}
  .head-meta a.badge{transition:background .3s var(--ease),border-color .3s var(--ease)}
  .head-meta a.badge:hover{background:var(--green-100);border-color:var(--green-200)}
  .product-title{letter-spacing:-.01em}
  .rating-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-75) var(--s-100)}
  .stars{display:inline-flex;align-items:center;gap:var(--s-25);color:var(--line-strong)}
  .stars .is-on{color:var(--amber-600)}
  .stars svg{width:var(--s-200);height:var(--s-200);fill:currentColor;stroke:none}
  .stars--lg svg{width:20px;height:20px}
  .price-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s-75) var(--s-100)}
  .price{color:var(--green-800)}
  .old-price{text-decoration:line-through}
  .sales-row{display:flex;flex-wrap:wrap;gap:var(--s-100) var(--s-400)}
  .sales-item{display:flex;flex-direction:column;gap:var(--s-25)}
  .spec-box{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s-75) var(--s-200)}
  .qty-row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-100) var(--s-200)}
  .qty-row__label{flex:none}
  .stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:var(--r-md);overflow:hidden;background:var(--surface)}
  .stepper button{width:var(--s-500);height:var(--s-500);border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2);cursor:pointer;transition:background .3s var(--ease),color .3s var(--ease)}
  .stepper button:hover{background:var(--surface-2);color:var(--ink)}
  .stepper button:active{background:var(--bg-alt)}
  .stepper button:disabled{opacity:.45;cursor:not-allowed}
  .stepper button svg{width:var(--s-200);height:var(--s-200)}
  .stepper__minus{display:block;width:var(--s-200);height:2px;border-radius:var(--r-full);background:currentColor}
  .stepper__input{width:var(--s-600);border:0;background:transparent;text-align:center;font-variant-numeric:tabular-nums;padding:0;appearance:textfield;-moz-appearance:textfield}
  .stepper__input::-webkit-outer-spin-button,.stepper__input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .stepper__input:focus-visible{outline:2px solid var(--green-600);outline-offset:-2px}
  .cta-row{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:var(--s-100);margin-top:var(--s-75)}
  .promise{display:flex;flex-direction:column;gap:var(--s-75);padding-top:var(--s-200);border-top:1px solid var(--line)}
  .promise__item{display:flex;align-items:flex-start;gap:var(--s-75);color:var(--ink-2)}
  .promise__item svg{width:var(--s-200);height:var(--s-200);color:var(--green-700);flex:none;margin-top:var(--s-25)}
  .promise__item b{color:var(--ink)}

  /* 待审核 */
  .pending{display:flex;flex-direction:column;gap:var(--s-100)}
  .rules{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s-200)}
  .rules__list{display:flex;flex-direction:column;gap:var(--s-75);margin-top:var(--s-100)}
  .rules__item{display:grid;grid-template-columns:var(--s-300) minmax(0,1fr);gap:var(--s-75);align-items:start;color:var(--ink-2)}
  .rules__num{width:var(--s-300);height:var(--s-300);border-radius:50%;background:var(--surface);border:1px solid var(--line-strong);display:grid;place-items:center;color:var(--muted)}

  /* 农户卡 */
  .farmer{margin-top:var(--s-600)}
  .farmer__grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:var(--s-400);align-items:start}
  .farmer__id{display:flex;align-items:center;gap:var(--s-200);min-width:0}
  .farmer__meta{display:flex;flex-wrap:wrap;gap:var(--s-75) var(--s-200);margin-top:var(--s-200)}
  .meta{display:inline-flex;align-items:center;gap:var(--s-50);color:var(--muted);min-width:0}
  .meta svg{width:var(--s-200);height:var(--s-200);flex:none}
  .clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cert-row{display:flex;flex-wrap:wrap;gap:var(--s-50)}
  .farmer__actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:var(--s-100)}
  .farmer__actions .btn{margin-left:auto}

  /* 标签页 */
  .tabcard{margin-top:var(--s-500);scroll-margin-top:calc(var(--nav-h) + var(--s-500))}
  .tabcard .tabs{padding-inline:var(--s-300);padding-top:var(--s-75);background:var(--surface)}
  .tabcard .tabs button{transition:color .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease)}
  .tabcard .tabs button:hover{color:var(--ink)}
  .tabcard .tabs button:active{transform:translateY(1px)}
  .panel{padding:var(--s-300)}
  .panel[data-active="true"]{animation:panelIn .5s var(--ease)}
  @keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .detail-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:var(--s-400);align-items:start}
  .detail-copy{display:flex;flex-direction:column;gap:var(--s-300)}
  .detail-block p{margin-top:var(--s-75)}
  .aside{display:flex;flex-direction:column;gap:var(--s-200)}
  .aside-card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s-200)}
  .highlight-list{display:flex;flex-direction:column;gap:var(--s-100)}
  .check-line{display:flex;align-items:flex-start;gap:var(--s-75);color:var(--ink-2)}
  .check-line svg{width:var(--s-200);height:var(--s-200);color:var(--green-700);flex:none;margin-top:var(--s-25)}
  .check-line--pending svg{color:var(--amber-700)}

  /* 检测报告 */
  .report-head{display:flex;flex-direction:column;gap:var(--s-200);margin-bottom:var(--s-300)}
  .report-meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-100) var(--s-300);padding:var(--s-200);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md)}
  .report-meta__item{display:flex;flex-direction:column;gap:var(--s-25);min-width:0}
  .test-name{display:inline-flex;align-items:center;flex-wrap:wrap;gap:var(--s-50)}
  .table td .badge{vertical-align:middle}
  .report-note{margin-top:var(--s-100)}

  /* 价格构成 */
  .bars{display:flex;flex-direction:column;gap:var(--s-200);max-width:720px}
  .bar{display:flex;flex-direction:column;gap:var(--s-75)}
  .bar__head{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-200)}
  .bar__label{display:flex;align-items:center;gap:var(--s-75);min-width:0}
  .bar__dot{width:var(--s-75);height:var(--s-75);border-radius:50%;background:var(--green-600);flex:none}
  .bar--platform .bar__dot{background:var(--amber-600)}
  .bar--platform .meter__fill{background:var(--amber-600)}
  .bars-total{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-200);border-top:1px solid var(--line);padding-top:var(--s-200);margin-top:var(--s-300)}
  .price-note{margin-top:var(--s-200);max-width:720px}

  /* 评价 */
  .review-summary{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-100) var(--s-300);padding-bottom:var(--s-300);border-bottom:1px solid var(--line);margin-bottom:var(--s-100)}
  .review-score{display:flex;flex-direction:column;gap:var(--s-25)}
  .review-list{display:flex;flex-direction:column}
  .review-item{display:grid;grid-template-columns:var(--s-500) minmax(0,1fr);gap:var(--s-100);padding-block:var(--s-200);border-bottom:1px solid var(--line)}
  .review-item:last-child{border-bottom:0;padding-bottom:0}
  .review-head{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-50) var(--s-100)}
  .review-text{margin-top:var(--s-75)}
  .review-tags{display:flex;flex-wrap:wrap;gap:var(--s-50);margin-top:var(--s-75)}

  /* 同产地推荐 */
  .related{margin-top:var(--s-600)}
  .section-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:var(--s-100);margin-bottom:var(--s-300)}
  .rec-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-300)}
  .rec{display:flex;flex-direction:column;overflow:hidden}
  .rec__art{aspect-ratio:4/3;display:grid;place-items:center;padding:var(--s-200);background:var(--surface-2)}
  .rec__art svg{width:78%;height:auto}
  .rec__body{display:flex;flex-direction:column;gap:var(--s-75);padding:var(--s-200)}
  .rec__price{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--s-75)}
  .rec__meta{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-50) var(--s-100);color:var(--muted)}

  /* 移动端固定购买条 */
  .mobile-buy{display:none}
  .success-mark{width:var(--s-700);height:var(--s-700);border-radius:50%;background:var(--green-100);color:var(--green-700);display:grid;place-items:center;margin-inline:auto}
  .success-mark svg{width:var(--s-400);height:var(--s-400)}

  /* 弹窗表单 */
  .buy-summary{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s-200)}
  .form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--s-200)}
  .form-grid .full{grid-column:1/-1}
  .field__hint--error{color:var(--red-700)}
  .order-total{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s-200);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s-100) var(--s-200)}
  .order-lines{display:flex;flex-direction:column;gap:var(--s-50);color:var(--muted)}
  .qty-inline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s-200);align-items:end}
  .qty-inline .stepper{align-self:flex-start}
  .wrap-any{overflow-wrap:anywhere}

  /* 响应式 */
  @media (min-width:820px){
    .panel{padding:var(--s-400)}
  }
  @media (max-width:900px){
    .product-grid{grid-template-columns:minmax(0,1fr);gap:var(--s-300)}
    .stage{padding:var(--s-200)}
  }
  @media (max-width:820px){
    .page{padding-top:calc(var(--nav-h) + var(--s-200));padding-bottom:var(--s-600)}
    body{padding-bottom:var(--s-800)}
    .farmer__grid{grid-template-columns:minmax(0,1fr);gap:var(--s-200)}
    .detail-grid{grid-template-columns:minmax(0,1fr);gap:var(--s-300)}
    .rec-grid{grid-template-columns:minmax(0,1fr)}
    .mobile-buy{display:flex;position:fixed;left:var(--s-200);right:var(--s-200);bottom:var(--s-200);z-index:90;align-items:center;justify-content:space-between;gap:var(--s-200);padding:var(--s-75) var(--s-75) var(--s-75) var(--s-200);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-full);box-shadow:var(--shadow-md)}
    .mobile-buy__price{display:flex;flex-direction:column;gap:var(--s-0);min-width:0}
  }
  @media (max-width:640px){
    .report-meta{grid-template-columns:minmax(0,1fr);gap:var(--s-75)}
  }
  @media (max-width:480px){
    .stage svg{width:76%}
    .thumbs{gap:var(--s-50)}
    .thumb{padding:var(--s-25)}
    .form-grid{grid-template-columns:minmax(0,1fr)}
    .form-grid .full{grid-column:auto}
    .review-item{grid-template-columns:minmax(0,1fr)}
    .review-item .avatar{display:none}
    .cta-row{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}
  }
  @media (max-width:360px){
    .cta-row{grid-template-columns:minmax(0,1fr)}
    .cta-row .btn{width:100%}
  }
  @media (prefers-reduced-motion:reduce){
    .panel[data-active="true"]{animation:none}
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<div class="nav-shell" data-nav="market"></div>
<main id="main" class="page">
  <div class="container">
    <nav class="crumb body-6" id="crumb" aria-label="面包屑">
      <a href="/">首页</a>
      <span class="crumb__sep" aria-hidden="true">/</span>
      <span class="muted">商品详情</span>
    </nav>
    <div id="app">
      <p class="sr-only" role="status">正在加载商品信息</p>
      <div class="product-grid" aria-hidden="true">
        <div class="gallery">
          <div class="skeleton sk-stage" style="aspect-ratio:1/1;border-radius:var(--r-xl)"></div>
          <div class="thumbs">
            <div class="skeleton" style="aspect-ratio:1/1;border-radius:var(--r-md)"></div>
            <div class="skeleton" style="aspect-ratio:1/1;border-radius:var(--r-md)"></div>
            <div class="skeleton" style="aspect-ratio:1/1;border-radius:var(--r-md)"></div>
            <div class="skeleton" style="aspect-ratio:1/1;border-radius:var(--r-md)"></div>
          </div>
        </div>
        <div class="buybox">
          <div class="skeleton skeleton--text" style="width:28%;height:var(--s-200)"></div>
          <div class="skeleton" style="width:88%;height:var(--s-600)"></div>
          <div class="skeleton skeleton--text" style="width:46%"></div>
          <div class="skeleton" style="width:34%;height:var(--s-700)"></div>
          <div class="skeleton skeleton--text" style="width:60%"></div>
          <div class="skeleton" style="width:100%;height:var(--s-700)"></div>
          <div class="skeleton" style="width:100%;height:var(--s-500)"></div>
        </div>
      </div>
    </div>
    <div id="related"></div>
  </div>
</main>
<div data-footer></div>
<div id="mobile-buy"></div>
<script src="/assets/app.js?v=20261127g"></script>
<script src="/assets/art.js"></script>

</body>

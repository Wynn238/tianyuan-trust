<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>溯源码查询 · 田源可信</title>
<meta name="description" content="输入箱贴上的批次码，查看产地、农事记录、检测报告与冷链温度，并核对每条记录的链上哈希。">
<meta property="og:title" content="溯源码查询 · 田源可信">
<meta property="og:description" content="一箱一码，扫码即达本页。产地、农事、检测、冷链四类记录随码可查。">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%231B4B34'/%3E%3Cpath d='M5 19C5 11 11 5 19 4c1 9-5 15-14 15Z' fill='%23C9DFCF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/assets/design.css?v=20261127c">
  <link rel="stylesheet" href="/assets/auth.css?v=20261127f">
<style>
  /* ------------------------------------------------------------------
     溯源码查询页 · 仅本页布局。颜色 / 字号 / 间距 / 圆角全部取 design.css token。
     ------------------------------------------------------------------ */
  [hidden]{display:none !important}
  #result{scroll-margin-top:calc(var(--nav-h) + var(--s-500))}
  .mt-100{margin-top:var(--s-100)}

  .trace-hero{padding-top:calc(var(--nav-h) + var(--s-700));padding-bottom:var(--s-600)}
  body.is-result .trace-hero{padding-top:calc(var(--nav-h) + var(--s-400));padding-bottom:var(--s-400)}
  .trace-hero__grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:var(--s-600);align-items:center}
  .trace-hero__copy .badge svg{width:14px;height:14px}
  .trace-search-card{box-shadow:var(--shadow-md)}
  .trace-search{display:flex;align-items:stretch;gap:var(--s-100);margin-top:var(--s-75)}
  .trace-search .search{flex:1;min-width:0}
  .trace-input{padding-block:var(--s-200)}
  .trace-error{margin-top:var(--s-200)}
  .trace-chips{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s-75)}
  .chip{border-radius:var(--r-full)}

  .trace-body{padding-block:var(--s-500) var(--s-800)}
  .result-bar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--s-200);padding:var(--s-100) var(--s-200)}
  .trace-layout{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:var(--s-300);margin-top:var(--s-300)}
  .trace-main,.trace-rail{display:flex;flex-direction:column;gap:var(--s-300);min-width:0}

  .sec-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--s-100) var(--s-200)}
  .sec-head__title{display:flex;align-items:center;gap:var(--s-75);min-width:0}
  .sec-head__title > svg{width:20px;height:20px;flex:none;color:var(--green-700)}
  .badge svg,.tag svg{width:14px;height:14px;flex:none}

  /* 摘要 */
  .summary{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s-400);align-items:center}
  .summary__art{display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--s-200)}
  .summary__art svg{width:100%;height:auto;max-width:200px}
  .summary__body{min-width:0}
  .codebar{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s-75)}
  .codebar__code{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:var(--s-50) var(--s-100);overflow-wrap:anywhere}
  .meta-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-200) var(--s-300)}
  .meta{display:flex;flex-direction:column;gap:var(--s-25);min-width:0}
  .meta--wide{grid-column:1/-1}
  .meta__v{overflow-wrap:anywhere}

  /* 校验 */
  .verify{align-items:flex-start;flex-wrap:wrap}
  .verify__body{flex:1 1 60%;min-width:0;display:flex;flex-direction:column;gap:var(--s-25)}
  .verify .badge{margin-left:auto}

  /* 二维码 */
  .qr-block{display:flex;align-items:flex-start;flex-wrap:wrap;gap:var(--s-300)}
  .qr-img{width:180px;height:180px;flex:none;padding:var(--s-75);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
  .qr-meta{display:flex;flex-direction:column;gap:var(--s-75);flex:1;min-width:220px}
  .qr-link{overflow-wrap:anywhere;color:var(--ink-2)}

  /* 时间线记录 */
  .rec__head{display:flex;flex-direction:column;gap:var(--s-50);width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer}
  .rec__top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s-100)}
  .rec__title{transition:color .3s var(--ease)}
  .rec__head:hover .rec__title{color:var(--green-800)}
  .rec__chev{display:grid;place-items:center;flex:none;color:var(--muted);transition:transform .4s var(--ease)}
  .rec__chev svg{width:16px;height:16px}
  .rec__head[aria-expanded="false"] .rec__chev{transform:rotate(-90deg)}
  .rec__detail{display:flex;flex-direction:column;gap:var(--s-100);margin-top:var(--s-100)}
  .rec__detail:not([hidden]){animation:recIn .4s var(--ease)}
  @keyframes recIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .rec__ev{display:flex;flex-wrap:wrap;gap:var(--s-75)}
  .ev{display:inline-flex;align-items:baseline;gap:var(--s-50);padding:var(--s-25) var(--s-75);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm)}
  .rec__chain{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s-75);padding-top:var(--s-100);border-top:1px dashed var(--line)}
  .rec__hash{padding:var(--s-25) var(--s-75);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);overflow-wrap:anywhere}

  /* 检测报告 */
  .ratio{display:flex;align-items:center;gap:var(--s-75);min-width:var(--s-700)}
  .ratio .meter{flex:1}

  /* 冷链 */
  .cp{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s-50) var(--s-100);padding-block:var(--s-75);border-bottom:1px dashed var(--line)}
  .cp:last-child{border-bottom:0}
  .cp__place{flex:1 1 45%;min-width:0}
  .cp__time{flex:none}
  .cp__temp{margin-left:auto}

  /* 生产者 */
  .story{display:flex;align-items:center;gap:var(--s-200)}
  .story__who{display:flex;flex-direction:column;gap:var(--s-25);min-width:0}
  .quote{display:flex;align-items:flex-start;gap:var(--s-100)}
  .quote svg{width:20px;height:20px;flex:none;color:var(--green-600)}
  .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-200)}
  .fact{display:flex;flex-direction:column;gap:var(--s-25)}

  /* 价格构成 / 折叠 */
  .fold summary{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s-50) var(--s-100);cursor:pointer;list-style:none}
  .fold summary::-webkit-details-marker{display:none}
  .fold summary .caption-2{margin-left:auto;text-align:right}
  .fold[open] summary .rec__chev{transform:rotate(180deg)}

  /* 其他批次 */
  .related{display:flex;flex-direction:column;gap:var(--s-75)}
  .related__row{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s-50) var(--s-100);padding:var(--s-100);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);transition:background .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease)}
  .related__row:hover{background:var(--surface-2);border-color:var(--line-strong)}
  .related__row:active{transform:scale(.995)}
  .related__go{margin-left:auto;color:var(--muted)}
  .related__go svg{width:18px;height:18px}

  /* AI 面板 */
  .ai-card{position:sticky;top:calc(var(--nav-h) + var(--s-400));scroll-margin-top:calc(var(--nav-h) + var(--s-400))}
  .rail-jump{display:none}
  .ai-suggests{display:flex;flex-direction:column;gap:var(--s-75)}
  .ai-suggest{display:flex;align-items:center;justify-content:space-between;gap:var(--s-100);width:100%;padding:var(--s-75) var(--s-100);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);text-align:left;cursor:pointer;transition:background .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease)}
  .ai-suggest:hover{background:var(--surface);border-color:var(--line-strong)}
  .ai-suggest:active{transform:scale(.99)}
  .ai-suggest svg{width:16px;height:16px;flex:none;color:var(--muted)}
  .ai-log{position:relative;max-height:min(calc(var(--s-900) * 4.6), calc(100vh - var(--s-900) * 5));overflow-y:auto;margin-top:var(--s-200);padding-right:var(--s-25)}
  .ai-empty{display:flex;flex-direction:column;align-items:flex-start;gap:var(--s-50);padding:var(--s-200);border:1px dashed var(--line-strong);border-radius:var(--r-md);color:var(--muted)}
  .ai-empty svg{width:20px;height:20px}
  .ai-turn{display:flex;flex-direction:column;gap:var(--s-100)}
  .ai-turn + .ai-turn{border-top:1px dashed var(--line);padding-top:var(--s-200)}
  .ai-log .msg{max-width:100%}
  .ai-answer{display:flex;flex-direction:column;gap:var(--s-75)}
  .ai-meta{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s-75)}
  .ai-form{display:flex;align-items:stretch;gap:var(--s-75);margin-top:var(--s-200)}
  .ai-form .input{flex:1;min-width:0}
  .ai-send{flex:none;padding-inline:var(--s-200)}
  .ai-send svg{width:20px;height:20px}
  .ai-log .workflow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-75)}
  .ai-log .workflow__step{padding:var(--s-75)}
  .workflow__step > div{min-width:0}
  .workflow__step p + p{margin-top:var(--s-25)}

  /* 引导态 */
  .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-300)}
  .step{display:flex;flex-direction:column;gap:var(--s-75);padding:var(--s-200);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md)}
  .step__idx{display:grid;place-items:center;width:var(--s-300);height:var(--s-300);border-radius:var(--r-full);background:var(--green-100);color:var(--green-800)}
  .hot{display:flex;align-items:center;gap:var(--s-200);padding:var(--s-200)}
  .hot__art{width:var(--s-900);height:var(--s-900);flex:none;display:grid;place-items:center;overflow:hidden;background:var(--surface-2);border-radius:var(--r-md);color:var(--muted)}
  .hot__art svg{width:100%;height:100%}
  .hot__art--plain svg{width:var(--s-300);height:var(--s-300)}
  .hot__body{display:flex;flex-direction:column;gap:var(--s-25);flex:1;min-width:0}
  .hot__code{color:var(--muted)}
  .hot__go{flex:none;color:var(--muted)}
  .hot__go svg{width:18px;height:18px}

  /* 骨架 */
  .sk-summary{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s-400)}
  .sk-art{aspect-ratio:1;max-width:200px;border-radius:var(--r-lg)}
  .sk-hot{height:calc(var(--s-900) + var(--s-400));border-radius:var(--r-lg)}

  /* 页脚图标兜底（app.js 生成的徽标内图标未带尺寸） */
  .footer .badge svg{width:14px;height:14px}
  .footer .nav__mark svg{width:18px;height:18px}
  .nav__mark svg{width:18px;height:18px}

  @media (max-width:1080px){
    .trace-layout{grid-template-columns:minmax(0,1fr)}
    .ai-card{position:static}
    .rail-jump{display:inline-flex}
  }
  @media (max-width:980px){
    .trace-hero{padding-top:calc(var(--nav-h) + var(--s-600))}
    .trace-hero__grid{grid-template-columns:minmax(0,1fr);align-items:start;gap:var(--s-400)}
  }
  @media (max-width:820px){
    .steps{grid-template-columns:minmax(0,1fr)}
  }
  @media (max-width:640px){
    .summary,.sk-summary{grid-template-columns:minmax(0,1fr)}
    .summary__art,.sk-art{max-width:240px}
    .ai-log{max-height:none}
  }
  @media (max-width:560px){
    .meta-grid{grid-template-columns:minmax(0,1fr)}
    .facts{gap:var(--s-100)}
    .ai-log .workflow{grid-template-columns:minmax(0,1fr)}
  }
  @media (max-width:480px){
    .trace-search{flex-wrap:wrap}
    .trace-search .btn{width:100%}
    .qr-img{width:100%;max-width:180px;height:auto}
  }
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<div class="nav-shell" data-nav="trace"></div>

<main id="main">
  <section class="trace-hero">
    <div class="container">
      <div class="trace-hero__grid">
        <div class="trace-hero__copy" data-reveal>
          <p class="eyebrow">溯源码查询</p>
          <h1 class="heading-2 mt-200">扫一箱的码，<br>查它走过的每一步</h1>
          <p class="body-3 muted mt-300" style="max-width:560px">输入箱贴上的批次码，这块地、这一季的农事、这份检测报告和这趟冷链都在这一页里；每条记录都带交易哈希，改动一条就会对不上。</p>
          <div class="row wrap gap-75 mt-300">
            <span class="badge badge--green"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2 19 6v5.6c0 4.3-2.9 7.4-7 8.8-4.1-1.4-7-4.5-7-8.8V6Z"/><path d="m9 12 2.2 2.2L15.4 10"/></svg> 哈希链存证</span>
            <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 3.5h5M10.5 3.5v6L5.8 18a1.8 1.8 0 0 0 1.6 2.6h9.2a1.8 1.8 0 0 0 1.6-2.6L13.5 9.5v-6"/><path d="M8 14h8"/></svg> 批批检测</span>
            <span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h9v9H3z"/><path d="M12 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.8"/><circle cx="16.5" cy="18" r="1.8"/></svg> 冷链逐节点</span>
          </div>
        </div>

        <div class="trace-search-card card card--pad-lg" data-reveal>
          <form id="searchForm" novalidate>
            <div class="field">
              <label class="field__label" for="codeInput">输入溯源码</label>
              <div class="trace-search">
                <div class="search">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
                  <input class="input trace-input mono" id="codeInput" name="code" type="text" autocomplete="off" spellcheck="false" placeholder="例如 TY-2026-0912-DS" aria-describedby="codeHint">
                </div>
                <button class="btn btn--primary btn--lg" type="submit">查询</button>
              </div>
              <p class="field__hint" id="codeHint">按回车也能查。扫箱贴二维码后，地址栏会自动带上码。</p>
            </div>
          </form>

          <div class="trace-error" id="searchError" hidden></div>

          <div class="trace-chips mt-200">
            <span class="caption-4 muted">示例码</span>
            <button type="button" class="btn btn--sm btn--secondary chip mono" data-example="TY-2026-0912-DS">TY-2026-0912-DS</button>
            <button type="button" class="btn btn--sm btn--secondary chip mono" data-example="TY-2026-1008-WC">TY-2026-1008-WC</button>
            <button type="button" class="btn btn--sm btn--secondary chip mono" data-example="TY-2026-1120-DD">TY-2026-1120-DD</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="container trace-body" id="result" aria-label="溯源结果"></section>
</main>

<div data-footer></div>

<script src="/assets/app.js?v=20261127g"></script>
<script src="/assets/art.js"></script>
<script src="/js/auth.js?v=20261127f"></script>
  <script src="/assets/journey3d.js"></script>
<script src="/js/trace.js"></script>
</body>
</html>
